<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A real phone browser lays the page out at the device width; without
         this meta an emulated phone page renders at the ~980px desktop
         fallback width and never exercises the narrow layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity Overview — UAT harness</title>
    <style>
      /* Harness chrome, inline (dist/app.css only carries the plugin's own
         classes): a full-height stage standing in for the bb panel surface. */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #111418; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
