name: Feature request
description: Propose a new view, encoding, or behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance sketch }
