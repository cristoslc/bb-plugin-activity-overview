test_suite:
  id: uat-token-flow-swimlanes-001
  title: Token flow renders as a swimlane flow-control stack — projects pile vertically, tiers tile, rivers front the cards
  description: >
    Headless suite for the swimlane token-flow port. Projects pile vertically as
    one full-width row each (never tiled); an expanded row tiles its status
    tiers across the width as four lanes (Working, Needs You, Unread, Idle) with
    a gutter between them and no overlap; every card's river paints in front of
    the cards, deepest first, from the project's one mouth; a collapsed group
    head reads its subtree sum (Σ) and drops to its own flow once expanded; and
    each lane scrolls on its own without moving a neighbour. The mock SDK serves
    a fixed flow fixture (Alpha work opens by default, its Working lane holds
    more cards than the capped lane height holds). The left Tier-1 column is a
    stack of nested boxes — outer = the subscription (the default; or the ACP
    provider, via the view-chrome toggle), inner = the model (or the
    subscription+model pair) — with every box's height encoding active token flow.
  tags: [interaction, tokenflow, swimlane, tiers, uat, headless]

test_cases:
  - id: TC-01
    title: Projects pile vertically as one full-width row each, never tiled
    criticality: blocker
    precondition: >
      dist/ is built (npm run build); the harness serves it; headless Chrome is
      available at CHROME_PATH (default: system Chrome).
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-row="proj_alpha"]' }
        instruction: Wait for the flow RPC to land and the stack to paint.
        expected: The project rows are on screen.
      - order: 3
        action: swimlane
        params: { check: stack }
        instruction: Read every project row's box.
        expected: Rows descend without overlap and all share one full width and one left edge — the stack, not a tile grid.
      - order: 4
        action: profile
        params: {}
        instruction: Capture the finished stack.
        expected: A full-view screenshot of the project stack for the report.

  - id: TC-02
    title: An expanded row tiles four status lanes left-to-right, gutter-separated, no occlusion
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-lane="working"]' }
        instruction: Wait for the seeded (hottest) project to open its lanes.
        expected: Four lanes paint inside the opened row.
      - order: 3
        action: swimlane
        params: { check: lanes }
        instruction: Read every lane's box in the expanded row.
        expected: Working, Needs You, Unread, Idle tile left to right with a gutter and no lane overlapping its neighbour.
      - order: 4
        action: profile
        params: {}
        instruction: Capture the tiled lanes.
        expected: A screenshot showing the four gutter-separated lanes.

  - id: TC-03
    title: Every card's river paints in front of the cards, all from the one project mouth
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-river]' }
        instruction: Wait for the Working lane's rivers.
        expected: Rivers paint from the project's one mouth.
      - order: 3
        action: swimlane
        params: { check: rivers }
        instruction: Read the DOM order and geometry of the Working lane's cards and rivers.
        expected: Every river paints after every card (in front), deepest first, and every river's band leaves the same single mouth; the other lanes carry no rivers.
      - order: 4
        action: assertBeads
        params: {}
        instruction: Sample the Working lane's bead paths' stroke offsets twice.
        expected: The beads drift — the rivers animate, so live activity is visible without re-rendering.
      - order: 5
        action: profile
        params: {}
        instruction: Capture the rivers.
        expected: A screenshot showing the rivers fanning from the one mouth.

  - id: TC-04
    title: A collapsed group head reads its subtree sum (Σ) and drops to its own flow once expanded
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_running"]' }
        instruction: Wait for the nested-card chain to paint.
        expected: The runaway thread's card is on screen, collapsed.
      - order: 3
        action: swimlane
        params: { check: group-collapsed }
        instruction: Read the collapsed group head's label.
        expected: The head reports `Σ … tok/min · … total` — the whole subtree's flow while collapsed.
      - order: 4
        action: click
        params: { selector: '[data-attn-card-rect="thr_running"]' }
        instruction: Open the group head.
        expected: Its children nest inside the card and the head's river drops to its own flow.
      - order: 5
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_running"][data-open="true"]' }
        instruction: Wait for the card to re-render open.
        expected: The card reports open, with its children nested inside it.
      - order: 6
        action: swimlane
        params: { check: group-expanded }
        instruction: Read the expanded group head's label.
        expected: The head reports `own … tok/min · … total` (its own flow, the subtree total still shown).
      - order: 7
        action: profile
        params: {}
        instruction: Capture the nested cards.
        expected: A screenshot of the parent → child → grandchild chain nested inside one card.

  - id: TC-05
    title: Each lane scrolls on its own; scrolling one never moves another
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-lane][data-overflow="true"]' }
        instruction: Wait for the Working lane to overflow its capped height.
        expected: The Working lane carries more cards than fit, so it reports overflow.
      - order: 3
        action: wheelLane
        params: { delta: 260 }
        instruction: Wheel over the overflowing lane.
        expected: That lane's card group scrolls; every other lane's card group is unmoved.
      - order: 4
        action: profile
        params: {}
        instruction: Capture the scrolled lane.
        expected: A screenshot showing the Working lane scrolled with the others at rest.

  - id: TC-06
    title: A collapsed row carries no lanes; expanding it reveals the four tiles
    criticality: standard
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-lane="working"]' }
        instruction: Wait for the seeded project's lanes.
        expected: Exactly one project is open, so four lanes paint.
      - order: 3
        action: assertCount
        params: { selector: '[data-attn-lane]', equals: 4 }
        instruction: Count the lanes with only the seeded project open.
        expected: Four lanes — the collapsed rows contribute none.
      - order: 4
        action: click
        params: { selector: '[data-attn-row-rect="proj_beta"]' }
        instruction: Expand the collapsed Beta infra row.
        expected: Its four lanes tile in below the header.
      - order: 5
        action: waitForSelector
        params: { selector: '[data-attn-lane-row="proj_beta"]' }
        instruction: Wait for the new lanes.
        expected: The row's lanes appear.
      - order: 6
        action: assertCount
        params: { selector: '[data-attn-lane]', equals: 8 }
        instruction: Count the lanes with two projects open.
        expected: Eight lanes — four per expanded project.

  - id: TC-07
    title: A running child under a waiting parent surfaces in the Working lane, not nested inside the parent
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_supervisor_child"]' }
        instruction: Wait for the running child of the waiting supervisor.
        expected: The running child is drawn at all.
      - order: 3
        action: assertCount
        params: { selector: '[data-attn-lane="working"] [data-attn-card="thr_supervisor_child"]', equals: 1 }
        instruction: Look for the running child in the Working lane.
        expected: The running child is a top-level card in the Working lane, so its river animates.
      - order: 4
        action: assertCount
        params: { selector: '[data-attn-lane="needs-you"] [data-attn-card="thr_supervisor_child"]', equals: 0 }
        instruction: Confirm it is not drawn inside the waiting parent's card.
        expected: Zero — one thread is one card, in its own lane.
      - order: 5
        action: swimlane
        params: { check: counts }
        instruction: Compare every lane's header count with the cards it draws.
        expected: Each lane's count equals its drawn cards, and the row's working count equals the Working lane's cards — no phantom count, no empty lane.

  - id: TC-08
    title: The provider→project segment is a river too, with its own drifting beads
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the swimlane stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-link]' }
        instruction: Wait for the provider→project rivers.
        expected: The spine feeds each project row with a river.
      - order: 3
        action: swimlane
        params: { check: links }
        instruction: Read the provider→project segments.
        expected: Each is a filled provider-colored band sized by that provider's flow in the project (the widest well above a hairline), live ones carry a bead ridge, and quiet ones stay bead-free.
      - order: 4
        action: assertBeads
        params: { segment: links }
        instruction: Sample the provider→project bead offsets twice.
        expected: Those beads drift, so the provider segment animates and not only the card segment.
      - order: 5
        action: profile
        params: {}
        instruction: Capture the full path.
        expected: A screenshot showing provider→project and project→card reading as one river.

  - id: TC-09
    title: Tier 1 is a stack of nested subscription/model boxes whose heights encode active flow
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the token-flow stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-tier1]' }
        instruction: Wait for the Tier-1 outer boxes to paint.
        expected: The subscription boxes are on screen.
      - order: 3
        action: swimlane
        params: { check: tiers }
        instruction: Read every outer box and the inner boxes nested inside it.
        expected: Two or more outer boxes (subscriptions, with an ACP provider standing in where the model has none), each wrapping its inner model boxes; every outer box's height covers its inner boxes, and box height is monotone in active flow (taller = more tok/min, floored so a quiet box stays legible).
      - order: 4
        action: profile
        params: {}
        instruction: Capture the nested boxes.
        expected: A screenshot of the nested subscription/model stack.

  - id: TC-10
    title: The view-chrome toggle swaps Tier 1 from subscription to ACP provider
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the token-flow stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-tier1]' }
        instruction: Wait for the Tier-1 boxes in the default (subscription) mode.
        expected: The subscription boxes are on screen.
      - order: 3
        action: swimlane
        params: { check: toggle }
        instruction: Click the "ACP provider" half of the Tier-1 toggle and re-read the boxes.
        expected: The grouping axis flips to the ACP provider, the outer keys change, and the inner boxes re-key to subscription-and-model pairs.
      - order: 4
        action: profile
        params: {}
        instruction: Capture the provider-mode boxes.
        expected: A screenshot of the provider→(subscription / model) boxes.

  - id: TC-11
    title: A burning grandchild gets its own river, from the same mouth, and its beads animate
    criticality: blocker
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the token-flow stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_running"]' }
        instruction: Wait for the runaway thread's card.
        expected: The collapsed group head is on screen.
      - order: 3
        action: click
        params: { selector: '[data-attn-card-rect="thr_running"]' }
        instruction: Open the first level.
        expected: The child card nests inside the parent.
      - order: 4
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_running_child"]' }
        instruction: Wait for the child card.
        expected: The child is on screen, inside the parent's box.
      - order: 5
        action: click
        params: { selector: '[data-attn-card-rect="thr_running_child"]' }
        instruction: Open the second level.
        expected: The grandchild card nests inside the child.
      - order: 6
        action: waitForSelector
        params: { selector: '[data-attn-lane="working"] [data-attn-card="thr_running_grand"][data-depth="2"]' }
        instruction: Wait for the grandchild at depth 2.
        expected: The grandchild card is drawn two levels deep in the Working lane.
      - order: 7
        action: assertCount
        params: { selector: '[data-attn-river="thr_running_grand"] path[stroke-dasharray]', equals: 1 }
        instruction: Count the grandchild's own bead ridge.
        expected: The grandchild draws its own river with a bead ridge — every level fans from the one mouth.
      - order: 8
        action: assertBeads
        params: { selector: '[data-attn-river="thr_running_grand"] path[stroke-dasharray]' }
        instruction: Watch the grandchild's own beads over 500ms.
        expected: The grandchild's river animates — its beads drift even at depth 2.

  - id: TC-12
    title: A rate too small to show as whole tok/min reads as quiet, never "0 tok/min"
    criticality: standard
    precondition: Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: { query: "?tab=tokenflow" }
        instruction: Open the panel on the Token flow tab.
        expected: The panel boots with the token-flow stage.
      - order: 2
        action: waitForSelector
        params: { selector: '[data-attn-card="thr_trickle"]' }
        instruction: Wait for the barely-burning thread's card.
        expected: The trickle thread is on screen.
      - order: 3
        action: swimlane
        params: { check: quiet }
        instruction: Scan every thread label for the misleading "0 tok/min".
        expected: No card or row reads "0 tok/min"; the sub-token thread reads "quiet"; a genuinely burning thread still shows its tok/min.
