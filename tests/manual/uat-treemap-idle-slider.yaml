test_suite:
  id: uat-treemap-idle-slider-001
  title: The treemap's idle-visibility slider steps down through the operator's duration ticks from all to none
  description: >
    Headless suite for the treemap's idle-visibility slider, now one tier of
    the shared filters card on every dot board. The slider's stops key to the
    ramp's named duration bounds and read No idle → <8 h → <24 h → <7 d →
    <30 d → <90 d → All Idle: the default top stop shows every idle thread,
    an intermediate stop shows idle threads under its bound, sliding down
    hides the dimmest (oldest) idle threads first, ending at none. Hidden
    threads leave the layout entirely — the treemap re-squarifies and the
    legend's visible total re-scales — hot threads are never hidden, the
    slider works in both mark modes (full-fill tiles at fit, dots zoomed in),
    and an empty bucket's stop hides nothing extra. The tick row renders all
    seven labels from the ramp constants; the active one carries the active
    marker (the static row always carries every label's text, so the suite
    asserts the marker, not the page text). Fixture ladder under the new
    buckets: thr_idle is bucket 0 (2h), thr_idle_week bucket 2 (2d),
    thr_idle_month bucket 3 (20d, mid-bucket), thr_idle_year bucket 5 (200d);
    buckets 1 (<24 h) and 4 (<90 d) are empty; three hot threads never leave.
  tags: [rendering, treemap, idle, slider, grey-ramp, filters, ticks, uat, headless]

test_cases:
  - id: TC-01
    title: The default stop shows every idle thread (all seven base threads)
    criticality: blocker
    preconditions:
      - dist/ has been built (`npm run build`); the harness serves it from vite
      - Headless Chrome is available at CHROME_PATH (default: system Chrome)
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Open the panel.
        expected: The tab bar paints and the harness is live.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the fitted view with the filters card mounted.
      - order: 3
        action: assertExists
        params:
          selector: '[data-attn-filters] input[type="range"]'
        instruction: Assert the idle-visibility slider is present in the filters card.
        expected: The slider input is mounted.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-mark="tile"]'
          equals: 7
        instruction: Assert every fixture thread renders a tile at the default stop.
        expected: Seven tiles — three hot plus four idle across the grey ramp.
      - order: 5
        action: waitFor
        params:
          text: 7 visible
        instruction: Assert the legend's visible total describes the full roster.
        expected: The legend reads "7 visible".
      - order: 6
        action: assertCount
        params:
          selector: "[data-attn-idle-tick]"
          equals: 7
        instruction: Assert the tick row renders all seven duration labels.
        expected: Seven ticks — No idle, <8 h, <24 h, <7 d, <30 d, <90 d, All Idle.
      - order: 7
        action: assertCount
        params:
          selector: '[data-attn-idle-tick="All Idle"][data-attn-idle-tick-active]'
          equals: 1
        instruction: Assert the top tick is the emphasized one at the default stop.
        expected: the All Idle tick is the active one.

  - id: TC-02
    title: A mid stop hides the idle threads at or past its bound (stop 3, <7 d)
    criticality: blocker
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop.
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "3"
        instruction: Slide to stop 3 (<7 d) — only idle threads under 7 days stay.
        expected: The treemap re-squarifies around the visible set.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-unit][data-thread-id="thr_idle_month"]'
          equals: 0
        instruction: Assert the 20d thread (bucket 3) left the layout.
        expected: No unit for thr_idle_month.
      - order: 5
        action: assertCount
        params:
          selector: '[data-attn-unit][data-thread-id="thr_idle_year"]'
          equals: 0
        instruction: Assert the dimmest thread (200d) left the layout.
        expected: No unit for thr_idle_year.
      - order: 6
        action: assertCount
        params:
          selector: '[data-attn-unit][data-thread-id="thr_idle_week"]'
          equals: 1
        instruction: Assert the 2d thread (bucket 2, under the bound) survives.
        expected: One tile for thr_idle_week.
      - order: 7
        action: assertCount
        params:
          selector: '[data-attn-mark="tile"]'
          equals: 5
        instruction: Assert exactly five tiles remain (three hot, two idle).
        expected: Five tiles mounted.
      - order: 8
        action: waitFor
        params:
          text: 5 visible
        instruction: Assert the legend's total re-scaled to the visible set.
        expected: The legend reads "5 visible".

  - id: TC-03
    title: The bottom stop (No idle) hides every idle thread — none
    criticality: blocker
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop.
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "0"
        instruction: Slide the stop to the bottom (No idle).
        expected: Every idle thread leaves the layout.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-unit][data-thread-id="thr_idle"]'
          equals: 0
        instruction: Assert the freshest idle thread (2h) is gone too.
        expected: No unit for thr_idle.
      - order: 5
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 3
        instruction: Assert only the three hot threads remain.
        expected: Three tiles mounted.
      - order: 6
        action: waitFor
        params:
          text: 3 visible
        instruction: Assert the legend's total re-scaled to the hot set.
        expected: The legend reads "3 visible".
      - order: 7
        action: profile
        instruction: Capture a screenshot of the idle-free board as evidence.
        expected: Evidence saved under docs/uat/.

  - id: TC-04
    title: The tick row names every stop from the ramp constants, the active one marked
    criticality: high
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop ("All Idle" active).
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "2"
        instruction: Slide to stop 2 (<24 h).
        expected: The active marker moves to the <24 h tick.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-idle-tick="<24 h"][data-attn-idle-tick-active]'
          equals: 1
        instruction: Assert the <24 h tick is the emphasized one.
        expected: the <24 h tick is the active one.
      - order: 5
        action: assertCount
        params:
          selector: '[data-attn-idle-tick-active]'
          equals: 1
        instruction: Assert exactly one tick is active at a time.
        expected: One active tick.
      - order: 6
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "0"
        instruction: Slide to the bottom stop.
        expected: The active marker moves to No idle.
      - order: 7
        action: assertCount
        params:
          selector: '[data-attn-idle-tick="No idle"][data-attn-idle-tick-active]'
          equals: 1
        instruction: Assert the bottom stop's tick.
        expected: the No idle tick is the active one.
      - order: 8
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "6"
        instruction: Slide back to the top stop.
        expected: The active marker moves to All Idle.
      - order: 9
        action: assertCount
        params:
          selector: '[data-attn-idle-tick="All Idle"][data-attn-idle-tick-active]'
          equals: 1
        instruction: Assert the top stop's tick.
        expected: the All Idle tick is the active one.

  - id: TC-05
    title: An empty bucket's stop hides nothing extra
    criticality: high
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop (7 units).
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "5"
        instruction: Stop 5 (<90 d) hides the 200d thread (bucket 5).
        expected: Six units remain.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 6
        instruction: Assert the dimmest cut took.
        expected: Six units mounted.
      - order: 5
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "4"
        instruction: Stop 4 (<30 d) names bucket 4, which has no fixture member.
        expected: Nothing else hides — the stop keys to the ramp, not the population.
      - order: 6
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 6
        instruction: Assert the empty bucket's stop changed nothing.
        expected: Still six units.
      - order: 7
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "3"
        instruction: Stop 3 (<7 d) hides the 20d thread (bucket 3).
        expected: Five units remain.
      - order: 8
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 5
        instruction: Assert the bucket-3 cut took.
        expected: Five units mounted.
      - order: 9
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "2"
        instruction: Stop 2 (<24 h) hides the 2d thread (bucket 2); bucket 1 has no fixture member.
        expected: Four units remain, the empty bucket adding nothing.
      - order: 10
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 4
        instruction: Assert the second cut and the empty bucket's no-op.
        expected: Four units — three hot plus the 2h thread.

  - id: TC-06
    title: The slider works in dot mode too, and sliding back up restores the dimmest last
    criticality: blocker
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop (tiles).
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "0"
        instruction: Slide to No idle at the fitted view.
        expected: Only the three hot threads remain.
      - order: 4
        action: click
        params:
          selector: '[data-attn-control="+"]'
        instruction: Zoom in past the mark-mode threshold.
        expected: The marks swap to dots.
      - order: 5
        action: assertCount
        params:
          selector: '[data-attn-mark="dot"]'
          equals: 3
        instruction: Assert the idle gate holds in dot mode.
        expected: Three dots — the hot threads only.
      - order: 6
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "6"
        instruction: Slide back to All Idle while zoomed in.
        expected: The dimmest threads return as dots.
      - order: 7
        action: assertCount
        params:
          selector: '[data-attn-mark="dot"]'
          equals: 7
        instruction: Assert all seven threads render as dots again.
        expected: Seven dots mounted.
      - order: 8
        action: assertCount
        params:
          selector: '[data-attn-unit][data-thread-id="thr_idle_year"]'
          equals: 1
        instruction: Assert the dimmest thread came back with the top stop.
        expected: One dot for thr_idle_year.

  - id: TC-07
    title: Working tiles keep their burn pulse at a filtered stop
    criticality: high
    preconditions:
      - Same harness session expectations as TC-01.
    steps:
      - order: 1
        action: goto
        params: {}
        instruction: Reopen the panel.
        expected: Board tab paints.
      - order: 2
        action: clickTab
        params:
          label: Unit treemap
        instruction: Switch to the Unit treemap tab.
        expected: The treemap paints at the default stop.
      - order: 3
        action: type
        params:
          selector: '[data-attn-filters] input[type="range"]'
          value: "1"
        instruction: Slide to stop 1 (<8 h) — only the 2h idle survives.
        expected: Four units remain; the hot tiles stay.
      - order: 4
        action: assertCount
        params:
          selector: '[data-attn-unit]'
          equals: 4
        instruction: Assert the stop-1 cut (three hot plus the freshest idle).
        expected: Four units mounted.
      - order: 5
        action: assertPulse
        instruction: Assert the working tiles still pulse at their measured burn.
        expected: Every pulsing unit animates; thr_running keeps its fast period.
